<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title desc">
  <title id="title">Nikolas Melo — Full-stack developer</title>
  <desc id="desc">Dark banner with a purple pixel motif and a short introduction to software, applied AI, and computer vision.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101016"/>
      <stop offset="1" stop-color="#08080d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a984ff"/>
      <stop offset="1" stop-color="#6541d9"/>
    </linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8b829d" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1584" height="396" fill="url(#background)"/>
  <rect width="1584" height="396" fill="url(#dots)"/>
  <rect x="0" y="0" width="8" height="396" fill="url(#accent)"/>

  <!-- A quieter nod to the pixel motif in the previous banner. -->
  <g fill="none" stroke="#9d76f2" stroke-width="2" opacity="0.45">
    <path d="M94 286 C155 286 160 180 230 180 S310 107 380 107"/>
    <path d="M146 325 C235 325 232 255 312 255 S395 201 458 201" opacity="0.55"/>
  </g>
  <g fill="url(#accent)">
    <rect x="77" y="269" width="34" height="34" rx="5"/>
    <rect x="158" y="163" width="34" height="34" rx="5"/>
    <rect x="229" y="163" width="34" height="34" rx="5"/>
    <rect x="298" y="90" width="34" height="34" rx="5"/>
    <rect x="371" y="90" width="34" height="34" rx="5"/>
  </g>
  <g fill="#e8e1ff">
    <rect x="126" y="269" width="18" height="18" rx="3" opacity="0.7"/>
    <rect x="192" y="199" width="18" height="18" rx="3" opacity="0.9"/>
    <rect x="265" y="127" width="18" height="18" rx="3" opacity="0.6"/>
    <rect x="337" y="127" width="18" height="18" rx="3" opacity="0.9"/>
    <rect x="412" y="164" width="18" height="18" rx="3" opacity="0.65"/>
  </g>
  <g fill="#7f6ea8" opacity="0.65">
    <rect x="77" y="319" width="11" height="11" rx="2"/>
    <rect x="95" y="319" width="11" height="11" rx="2"/>
    <rect x="429" y="90" width="11" height="11" rx="2"/>
    <rect x="447" y="90" width="11" height="11" rx="2"/>
  </g>

  <line x1="546" y1="78" x2="546" y2="318" stroke="#4b405f" stroke-width="2"/>
  <text x="604" y="132" fill="#b69cf3" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="4">HELLO, WORLD!</text>
  <text x="600" y="224" fill="#f7f5fb" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700" letter-spacing="-2">Nikolas Melo</text>
  <text x="604" y="276" fill="#d3cddf" font-family="Arial, Helvetica, sans-serif" font-size="29">Full-stack developer</text>
  <text x="604" y="323" fill="#9d96aa" font-family="Arial, Helvetica, sans-serif" font-size="21">Software  ·  Applied AI  ·  Computer vision</text>
</svg>
